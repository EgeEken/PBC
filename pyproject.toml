[project]
name = "PBC"
version = "2.3.1"
description = "Probabilistic Brush Compression (PBC) V2.3.1"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "numba>=0.59",
    "opencv-python>=4.8",
    "gradio>=5.0",
]
authors = [
    {name = "EgeEken", email = "egeeken.tr@gmail.com"},
]
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
gradio = "python PBC2_3_gradio.py"
notebook = "jupyter notebook PBC_Notebook.ipynb"
