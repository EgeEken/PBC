[build-system]
requires = ["setuptools==79.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pbc-codec"
version = "3.1.0"
description = "Probabilistic Brush Compression"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/**/*"]
authors = [{name = "Ege Eken"}]
dependencies = ["numpy==2.4.6", "numba==0.68.0", "Pillow==11.3.0"]

[project.scripts]
pbc = "pbc_cli:main"
pbc-decode = "pbc_decode_cli:decoder_main"

[tool.setuptools]
packages = ["pbc3"]
py-modules = ["PBC3", "pbc3_ops", "pbc3_stream", "pbc3_heads", "pbc3_features", "pbc3_types", "pbc3_trace", "learned_filler", "pbc3_decoder", "pbc3_decode_ops", "pbc3_native", "pbc3_cache", "pbc_cli", "pbc_decode_cli"]
include-package-data = false

[tool.setuptools.package-data]
pbc3 = ["patch_policy.npz", "mse.c", "mse.dll"]
